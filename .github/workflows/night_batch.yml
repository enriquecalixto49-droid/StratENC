name: Night dataload batch

on:
  schedule:
    - cron: "0 1 * * 2-6" # 01:00 UTC, Tue–Sat (= market data for Mon–Fri closes)
  workflow_dispatch:      # in case we want to trigger it manually.


concurrency:
  group: nightly-load
  cancel-in-progress: false


jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 359 # GitHub hard limit is 360. 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: FRED
        run: python -m backend.uploaders --source fred
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      
      - name: Tiingo (throttled)
        run: python -m backend.uploaders --source equity fx crypto --skip-static --start ${{ vars.START_DATE || '2015-01-01' }} --limit 280
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

      - uses: actions/upload-artifact@v4  # Always download and stock the rejected assets file
        if: always()
        with:
          name: rejected-assets
          path: backend/uploaders/rejected_assest/
          if-no-files-found: ignore